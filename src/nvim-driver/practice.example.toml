[practice]
collections = [
  "~/work/LeetKatas/practice/cpp/collections/core",
  "~/work/LeetKatas/practice/cpp/collections/chrono",
]
# database_path = "~/.local/share/leetkatas/practice.sqlite3"
# log_path = "~/.local/state/nvim/leetkatas/practice.log"
# notes_directory = "~/.local/share/leetkatas/notes"
review_archive_ttl_days = 30

[reviewer]
# "codex" uses the local Codex CLI; "openai" calls the Responses API with OPENAI_API_KEY.
# provider = "openai"
model = "gpt-5.6-luna"
reasoning_effort = "low"
# Direct-API only: "default", "fast", or "flex". The actual serving tier is recorded.
# service_tier = "default"
# Follow-up chat defaults to the standard review settings when omitted.
# follow_up_model = "gpt-5.6-luna"
# follow_up_reasoning_effort = "low"
# follow_up_provider = "openai"
# follow_up_service_tier = "default"

[editor]
indent_width = 4
which_key_delay_ms = 300
# Use Tree-sitter highlighting for exercise source when its language parser is available.
enhanced_syntax_highlighting = true
# Complete from words in the active exercise only. Ctrl+Space opens the menu.
local_completion = false
# Exercise import/include preambles are folded closed automatically.

[statusline]
left = ["exercise_name"]
right = ["solve_elapsed", "time_today", "reviews_today", "due_now", "new_left"]
separator = " · "

[evaluation]
compiler = "clang++"

[sync]
# Keep the server key only in PRACTICE_SUPABASE_KEY.
# supabase_url = "https://your-project.supabase.co"
